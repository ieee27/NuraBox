<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nura Box</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/dashboard.js"></script>
<script defer src="js/pages.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<div id="toasts" aria-live="polite"></div>

<!-- ============ LOGIN ============ -->
<section id="login-view" class="login">
  <div class="login-art" aria-hidden="true">
    <svg viewBox="0 0 400 300" class="pillbox">
      <rect x="40" y="70" width="320" height="170" rx="22" class="pb-body"/>
      <g class="pb-slots">
        <rect x="58" y="92" width="68" height="126" rx="12"/>
        <rect x="134" y="92" width="68" height="126" rx="12"/>
        <rect x="210" y="92" width="68" height="126" rx="12"/>
        <rect x="286" y="92" width="58" height="126" rx="12"/>
      </g>
      <g class="pb-lids">
        <rect class="lid l1" x="58" y="92" width="68" height="126" rx="12"/>
        <rect class="lid l2" x="134" y="92" width="68" height="126" rx="12"/>
        <rect class="lid l3" x="210" y="92" width="68" height="126" rx="12"/>
        <rect class="lid l4" x="286" y="92" width="58" height="126" rx="12"/>
      </g>
      <circle class="pb-led led1" cx="92" cy="80" r="5"/>
      <circle class="pb-led led2" cx="168" cy="80" r="5"/>
      <circle class="pb-led led3" cx="244" cy="80" r="5"/>
      <circle class="pb-led led4" cx="315" cy="80" r="5"/>
      <g class="pb-pills">
        <ellipse class="pill p1" cx="92" cy="150" rx="16" ry="8"/>
        <ellipse class="pill p2" cx="168" cy="160" rx="10" ry="10"/>
        <ellipse class="pill p3" cx="244" cy="148" rx="16" ry="8"/>
      </g>
    </svg>
    <h2 data-i18n="app_name">Nura Box</h2>
    <p data-i18n="tagline"></p>
  </div>
  <div class="login-side">
    <div class="login-tools">
      <button class="chip" data-action="lang" data-i18n-title="lang" type="button"><span data-i18n="lang_name"></span></button>
      <button class="chip" data-action="theme" data-i18n-title="theme" type="button"><span class="theme-icon">&#9680;</span></button>
    </div>
    <div class="glass login-card" id="login-card">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" data-action="auth-tab" data-tab="login" role="tab" type="button" data-i18n="tab_login"></button>
        <button class="tab" id="tab-register" data-action="auth-tab" data-tab="register" role="tab" type="button" data-i18n="tab_register"></button>
      </div>

      <form id="form-login" data-form="login" autocomplete="on" novalidate>
        <label class="fld"><span data-i18n="f_username"></span>
          <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>
        <label class="fld"><span data-i18n="f_password"></span>
          <span class="pw-wrap"><input name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-action="pw-toggle" data-i18n-title="show_pw">&#128065;</button></span>
        </label>
        <p class="form-err" id="login-err" role="alert"></p>
        <button class="btn primary block" type="submit" data-i18n="btn_login"></button>
      </form>

      <form id="form-register" data-form="register" hidden novalidate>
        <label class="fld"><span data-i18n="f_name"></span><input name="name" autocomplete="name" required></label>
        <label class="fld"><span data-i18n="f_role"></span>
          <select name="role"><option value="patient" data-i18n="role_patient"></option><option value="doctor" data-i18n="role_doctor"></option></select>
        </label>
        <label class="fld"><span data-i18n="f_username"></span>
          <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>
        <label class="fld"><span data-i18n="f_password"></span>
          <span class="pw-wrap"><input name="password" type="password" autocomplete="new-password" data-input="pw-strength" required>
          <button type="button" class="pw-toggle" data-action="pw-toggle" data-i18n-title="show_pw">&#128065;</button></span>
          <small class="pw-hint" id="pw-hint"></small>
        </label>
        <p class="form-err" id="register-err" role="alert"></p>
        <button class="btn primary block" type="submit" data-i18n="btn_register"></button>
      </form>

      <div class="demo" id="demo-box">
        <small data-i18n="demo_title"></small>
        <div class="demo-chips">
          <button class="chip" type="button" data-action="demo" data-kind="pat1">pat1</button>
          <button class="chip" type="button" data-action="demo" data-kind="doc1">doc1</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo">NB</span><strong>Nura Box</strong></div>
    <div class="topbar-right">
      <span class="conn conn-local" id="conn-badge" title=""></span>
      <button class="icon-btn" data-action="lang" type="button" data-i18n-title="lang"><span data-i18n="lang_name"></span></button>
      <button class="icon-btn" data-action="theme" type="button" data-i18n-title="theme"><span class="theme-icon">&#9680;</span></button>
      <button class="icon-btn" data-action="logout" type="button" data-i18n-title="logout">&#10162;</button>
    </div>
  </header>
  <main class="shell">
    <section class="page" id="page-home"></section>
    <section class="page" id="page-schedule"></section>
    <section class="page" id="page-network"></section>
    <section class="page" id="page-reports"></section>
    <section class="page" id="page-settings"></section>
  </main>
  <nav class="bottom-nav" aria-label="main">
    <button data-action="nav" data-page="home" type="button"><i>&#8962;</i><span data-i18n="nav_home"></span></button>
    <button data-action="nav" data-page="schedule" type="button"><i>&#9200;</i><span data-i18n="nav_schedule"></span></button>
    <button data-action="nav" data-page="network" type="button"><i>&#9993;</i><span data-i18n="nav_network"></span><b class="nav-badge" id="nav-badge-network" hidden></b></button>
    <button data-action="nav" data-page="reports" type="button"><i>&#9776;</i><span data-i18n="nav_reports"></span></button>
    <button data-action="nav" data-page="settings" type="button"><i>&#9881;</i><span data-i18n="nav_settings"></span></button>
  </nav>
</div>
</body>
</html>
